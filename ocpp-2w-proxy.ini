[logging]
proxy = DEBUG
websockets.client = INFO
websockets.server = INFO

[host]
; Host to listen on
addr = 0.0.0.0
; Port to listen on
port = 8321
; Seconds without OCPP traffic from the charger before the proxy pings it.
; The connection is closed only if the ping goes unanswered.
watchdog_stale = 500
; watchdog run / check interval in seconds
watchdog_interval = 100
; ping timeout in seconds
ping_timeout = 60

[ext-server]
; The CSMS (e.g. the Home Assistant OCPP integration). The charger ID is appended to this.
server = ws://192.168.42.3:9000
