name: Release

# Tag vX.Y.Z (matching `version` in grizzle-ocpp-proxy/config.yaml) to publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  OWNER: kccricket
  NAME: grizzle-ocpp-proxy

jobs:
  checks:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          version=$(yq -r .version grizzle-ocpp-proxy/config.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match config.yaml version v$version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One image per architecture, named the way the Supervisor expects: the app's
      # `image: ghcr.io/kccricket/{arch}-grizzle-ocpp-proxy` at tag `version`.
      - name: Build aarch64
        uses: docker/build-push-action@v6
        with:
          context: grizzle-ocpp-proxy
          platforms: linux/arm64
          provenance: false
          build-args: BUILD_VERSION=${{ env.VERSION }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/aarch64-${{ env.NAME }}:${{ env.VERSION }}
            ghcr.io/${{ env.OWNER }}/aarch64-${{ env.NAME }}:latest

      - name: Build amd64
        uses: docker/build-push-action@v6
        with:
          context: grizzle-ocpp-proxy
          platforms: linux/amd64
          provenance: false
          build-args: BUILD_VERSION=${{ env.VERSION }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/amd64-${{ env.NAME }}:${{ env.VERSION }}
            ghcr.io/${{ env.OWNER }}/amd64-${{ env.NAME }}:latest

      # A single multi-arch image for standalone Docker users.
      - name: Publish multi-arch image
        run: |
          for tag in "$VERSION" latest; do
            docker buildx imagetools create \
              --tag "ghcr.io/$OWNER/$NAME:$tag" \
              "ghcr.io/$OWNER/aarch64-$NAME:$VERSION" \
              "ghcr.io/$OWNER/amd64-$NAME:$VERSION"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
